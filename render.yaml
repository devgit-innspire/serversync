# Render Blueprint (free plan): Dashboard > New > Blueprint > pick this repo. Creates only the web server.
# The database is an external free MySQL 8 (Aiven); Render asks for the DB_* values when the Blueprint is created.
services:
  - type: web
    name: serversync
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: ecommerce_db
