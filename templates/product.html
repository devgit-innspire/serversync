<div class="detail">
  <div class="pimg detail-img" style="--h:{{hue}}" aria-hidden="true">{{{thumb}}}</div>
  <div class="detail-body">
    <p class="crumb"><a href="/products">All products</a> &rsaquo; <a href="/products?cat={{cat_id}}">{{category}}</a></p>
    <h1>{{name}}</h1>
    <p class="detail-desc">{{description}}</p>
    <div class="price big">{{price}}</div>
    {{{stock}}}
    {{{action}}}
  </div>
</div>
<p class="back"><a href="/products">&larr; Back to products</a></p>
