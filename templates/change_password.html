<h1>&#128273; Change password</h1>
<form class="box" method="post" action="/account/password" data-name="{{name}}" data-email="{{email}}">
  <label>Current password</label>{{{current_field}}}
  <label>New password</label>{{{password_field}}}
  <label>Confirm new password</label>{{{confirm_field}}}
  {{{rules}}}
  <button class="primary">Change password</button>
</form>
<p class="muted">Changing your password signs you out on all your other devices.</p>
