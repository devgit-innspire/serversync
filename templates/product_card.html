<article class="pcard">
  <a class="pimg" style="--h:{{hue}}" href="/product?id={{id}}" tabindex="-1" aria-hidden="true">{{{thumb}}}</a>
  <div class="pbody">
    <h3><a href="/product?id={{id}}">{{name}}</a></h3>
    <p class="pdesc">{{description}}</p>
    <div class="price">{{price}}</div>
    {{{stock}}}
    {{{action}}}
  </div>
</article>
