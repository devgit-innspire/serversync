<h1>Confirm your order</h1>
{{{warnings}}}
<form method="post" action="/checkout">
<div class="panel">
<h2 class="tl-title">Shipping address</h2>
{{{addresses}}}
<p><a class="button" href="/addresses/new?return=checkout">+ Add new address</a> <a class="muted" href="/addresses">Manage addresses</a></p>
</div>
{{{payment}}}
<div class="panel">
<div class="table-wrap"><table class="stack">
<tr class="thead"><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr>
{{{rows}}}
<tr class="total"><td colspan="3"><b>Total</b></td><td><b>{{total}}</b></td></tr>
</table></div>
<p class="muted">The final price and stock are checked again when you place the order.</p>
<div class="actions">{{{place}}} <a class="button" href="/cart">Back to cart</a></div>
</div>
</form>
