<h1>Dashboard</h1>
<div class="stats">{{{cards}}}</div>
<div class="two">
  <section class="card">
    <h2>Recent orders</h2>
    <div class="table-wrap"><table>
      <tr><th>#</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr>
      {{{orders}}}
    </table></div>
    <h3>Orders by status</h3>
    <div class="pills">{{{statuses}}}</div>
  </section>
  <section class="card">
    <h2>Low stock</h2>
    {{{low}}}
  </section>
</div>
