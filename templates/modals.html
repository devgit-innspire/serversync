<div class="modal" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <div class="modal-box">
    <button type="button" class="modal-close" data-close aria-label="Close">&times;</button>
    <h2 id="loginTitle">Sign in</h2>
    <form method="post" action="/login">
      <input name="email" type="email" placeholder="Email" maxlength="100" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit" class="primary">Log In</button>
    </form>
    <p class="modal-switch">No account? <a href="/signup" data-modal="signupModal">Sign up</a></p>
  </div>
</div>
<div class="modal" id="signupModal" role="dialog" aria-modal="true" aria-labelledby="signupTitle">
  <div class="modal-box">
    <button type="button" class="modal-close" data-close aria-label="Close">&times;</button>
    <h2 id="signupTitle">Create Account</h2>
    <form method="post" action="/signup">
      <input name="name" placeholder="Full Name" maxlength="100" required>
      <input name="email" type="email" placeholder="Email" maxlength="100" required>
      {{{password_field}}}
      {{{confirm_field}}}
      {{{rules}}}
      <button type="submit" class="primary">Sign Up</button>
    </form>
    <p class="modal-switch">Already registered? <a href="/login" data-modal="loginModal">Log in</a></p>
  </div>
</div>
